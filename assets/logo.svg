<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%" fill="none">
  <!-- Circular Luxury Border -->
  <circle cx="80" cy="80" r="76" stroke="#C69255" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6"/>
  <circle cx="80" cy="80" r="72" stroke="#6A223D" stroke-width="1.2" opacity="0.3"/>
  <circle cx="80" cy="80" r="68" fill="#FDFBF9"/>

  <!-- Crown Icon at Top -->
  <g transform="translate(62, 28) scale(0.9)">
    <path d="M2 14L8 4L20 12L32 4L38 14H2Z" fill="#C69255" stroke="#9E6728" stroke-width="0.8"/>
    <circle cx="2" cy="14" r="1.5" fill="#6A223D"/>
    <circle cx="8" cy="3.5" r="1.8" fill="#6A223D"/>
    <circle cx="20" cy="11" r="1.8" fill="#6A223D"/>
    <circle cx="32" cy="3.5" r="1.8" fill="#6A223D"/>
    <circle cx="38" cy="14" r="1.5" fill="#6A223D"/>
    <rect x="2" y="14" width="36" height="3" rx="1.5" fill="#9E6728"/>
  </g>

  <!-- Dressmaker Mannequin Silhouette -->
  <g transform="translate(64, 46)">
    <!-- Stand Neck Top -->
    <ellipse cx="16" cy="4" rx="4" ry="2" fill="#C69255"/>
    <line x1="16" y1="4" x2="16" y2="8" stroke="#C69255" stroke-width="1.5"/>
    
    <!-- Torso / Dress Form -->
    <path d="M9 10 C9 10, 16 12, 23 10 C25 15, 26 21, 23 27 C20 33, 19 36, 22 46 C23 48, 23 50, 20 50 C16 50, 12 50, 9 50 C6 50, 6 48, 7 46 C10 36, 9 33, 6 27 C3 21, 4 15, 9 10 Z" 
          fill="url(#torsoGrad)" stroke="#6A223D" stroke-width="1.2"/>
    
    <!-- Measuring Tape draped over shoulders -->
    <path d="M10 13 Q16 24 22 13" fill="none" stroke="#C69255" stroke-width="1.2" stroke-dasharray="1.5 1"/>
    
    <!-- Wooden Stand Pole & Base -->
    <line x1="16" y1="50" x2="16" y2="70" stroke="#9E6728" stroke-width="2"/>
    <path d="M8 72 C12 70, 20 70, 24 72 L26 74 H6 L8 72 Z" fill="#9E6728"/>
    <!-- Small tripod legs -->
    <line x1="16" y1="67" x2="7" y2="75" stroke="#9E6728" stroke-width="1.5"/>
    <line x1="16" y1="67" x2="25" y2="75" stroke="#9E6728" stroke-width="1.5"/>
  </g>

  <!-- Tailor Needle & Golden Thread -->
  <g transform="translate(38, 55)">
    <!-- Needle -->
    <path d="M12 5 L55 58" stroke="#6A223D" stroke-width="1.4" stroke-linecap="round"/>
    <!-- Eye of Needle -->
    <ellipse cx="14" cy="7" rx="1.2" ry="3" transform="rotate(-40 14 7)" fill="#FFFFFF" stroke="#6A223D" stroke-width="0.8"/>
    <!-- Thread loop -->
    <path d="M14 7 Q5 12 10 25 T30 28" fill="none" stroke="#C69255" stroke-width="1.2" stroke-linecap="round"/>
  </g>

  <!-- Elegant Floral Bouquet Laurel Sprigs -->
  <g stroke="#C69255" stroke-width="1.2" fill="#E8D5C4" stroke-linecap="round">
    <!-- Left Branch -->
    <path d="M42 110 C35 95, 36 78, 42 62" fill="none"/>
    <path d="M38 72 Q30 70 33 64 Q39 67 38 72 Z"/>
    <path d="M35 84 Q26 83 29 76 Q36 80 35 84 Z"/>
    <path d="M36 97 Q28 99 29 92 Q36 92 36 97 Z"/>
    <path d="M42 108 Q35 113 35 105 Q41 104 42 108 Z"/>

    <!-- Right Branch -->
    <path d="M118 110 C125 95, 124 78, 118 62" fill="none"/>
    <path d="M122 72 Q130 70 127 64 Q121 67 122 72 Z"/>
    <path d="M125 84 Q134 83 131 76 Q124 80 125 84 Z"/>
    <path d="M124 97 Q132 99 131 92 Q124 92 124 97 Z"/>
    <path d="M118 108 Q125 113 125 105 Q119 104 118 108 Z"/>
  </g>

  <!-- Small Rose Accent at Bottom -->
  <g transform="translate(80, 126)">
    <circle cx="0" cy="0" r="4.5" fill="#6A223D"/>
    <path d="M-2 -2 Q0 2 2 -2" fill="none" stroke="#D4A373" stroke-width="0.8"/>
    <circle cx="-6" cy="-1" r="2.5" fill="#557A6C" opacity="0.8"/>
    <circle cx="6" cy="-1" r="2.5" fill="#557A6C" opacity="0.8"/>
  </g>

  <defs>
    <linearGradient id="torsoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7D2B49"/>
      <stop offset="100%" stop-color="#55182E"/>
    </linearGradient>
  </defs>
</svg>
